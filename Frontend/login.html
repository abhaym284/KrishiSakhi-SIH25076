<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 🌱 KISORA</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: var(--bg-cream); min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Simplified Auth Header -->
    <header style="padding: 20px 0; border-bottom: 1px solid var(--border-light); background: #ffffff;">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" class="brand-logo">
                <span class="brand-icon">🌱</span>
                <span data-i18n="brandName">KISORA</span>
            </a>
            <div class="website-lang-picker">
                <span>🌐</span>
                <select id="websiteLangSelect" onchange="i18n.setLang(this.value)">
                    <option value="en">English</option>
                    <option value="hi">हिन्दी</option>
                    <option value="gu">ગુજરાતી</option>
                </select>
            </div>
        </div>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
        <div class="card" style="max-width: 460px; width: 100%; padding: 40px;">
            <div style="text-align: center; margin-bottom: 28px;">
                <span style="font-size: 2.5rem;">👨‍🌾</span>
                <h2 style="font-size: 1.8rem; margin-top: 8px;" data-i18n="loginWelcome">Welcome Back, Farmer</h2>
                <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 4px;" data-i18n="loginSubtitle">Continue your farming journey with KISORA.</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" data-i18n="labelMobileEmail">Mobile Number / Email</label>
                    <input type="text" id="loginIdentifier" class="form-control" placeholder="e.g. 9876543210 or farmer@gmail.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="labelPassword">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                        <button type="button" onclick="togglePassVisibility('loginPassword')" style="position: absolute; right: 12px; top: 12px; background: none; border: none; cursor: pointer; color: var(--text-muted);">👁️</button>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.88rem;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="rememberMe" checked>
                        <span data-i18n="labelRemember">Remember me</span>
                    </label>
                    <a href="#" style="color: var(--primary-main); font-weight: 600;" data-i18n="forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;" data-i18n="btnLoginSubmit">Login →</button>
            </form>

            <div style="text-align: center; margin: 20px 0; color: var(--text-muted); font-size: 0.85rem;" data-i18n="dividerOr">OR</div>

            <button class="btn-secondary" style="width: 100%; padding: 12px; font-size: 0.95rem;" onclick="handleDemoLogin()">
                🌐 <span data-i18n="btnGoogle">Continue with Google / Quick Demo</span>
            </button>

            <div style="text-align: center; margin-top: 28px; font-size: 0.9rem;">
                <a href="signup.html" style="font-weight: 600;" data-i18n="newToKisora">New to KISORA? Create account</a>
            </div>
        </div>
    </main>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function togglePassVisibility(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('loginIdentifier').value;
            const pass = document.getElementById('loginPassword').value;
            const remember = document.getElementById('rememberMe').checked;

            try {
                authService.login(id, pass, remember);
                showToast("Logged in successfully!");
                setTimeout(() => window.location.href = 'dashboard.html', 800);
            } catch (err) {
                alert(err.message);
            }
        }

        function handleDemoLogin() {
            authService.login("demo.farmer@kisora.org", "demo123", true);
            showToast("Demo Farmer session started!");
            setTimeout(() => window.location.href = 'dashboard.html', 800);
        }

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span>✓</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
