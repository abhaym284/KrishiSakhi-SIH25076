<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - 🌱 KISORA</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container navbar-inner">
            <a href="index.html" class="brand-logo">
                <span class="brand-icon">🌱</span>
                <span data-i18n="brandName">KISORA</span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html" class="nav-link" data-i18n="navHome">Home</a></li>
                <li><a href="ask.html" class="nav-link" data-i18n="navAsk">Ask KISORA</a></li>
                <li><a href="crops.html" class="nav-link" data-i18n="navCrops">Crop Guide</a></li>
                <li><a href="schemes.html" class="nav-link" data-i18n="navSchemes">Farmer Schemes</a></li>
                <li><a href="history.html" class="nav-link" data-i18n="navHistory">My History</a></li>
            </ul>

            <div class="nav-right">
                <div class="website-lang-picker">
                    <span>🌐</span>
                    <select id="websiteLangSelect" onchange="i18n.setLang(this.value)">
                        <option value="en">English</option>
                        <option value="hi">हिन्दी</option>
                        <option value="gu">ગુજરાતી</option>
                    </select>
                </div>

                <div id="navAuthArea">
                    <a href="login.html" class="btn-primary" data-i18n="navLogin">Login / Sign Up</a>
                </div>

                <button class="mobile-toggle" onclick="toggleMobileMenu()">☰</button>
            </div>
        </div>

        <div class="mobile-menu" id="mobileMenu">
            <a href="index.html" class="nav-link" data-i18n="navHome">Home</a>
            <a href="ask.html" class="nav-link" data-i18n="navAsk">Ask KISORA</a>
            <a href="crops.html" class="nav-link" data-i18n="navCrops">Crop Guide</a>
            <a href="schemes.html" class="nav-link" data-i18n="navSchemes">Farmer Schemes</a>
            <a href="history.html" class="nav-link" data-i18n="navHistory">My History</a>
            <a href="saved.html" class="nav-link" data-i18n="navSaved">Saved Advice</a>
            <a href="login.html" class="btn-primary" data-i18n="navLogin" style="text-align: center; margin-top: 10px;">Login / Sign Up</a>
        </div>
    </nav>

    <main class="container" style="padding: 40px 20px; max-width: 600px;">
        <div class="card" style="padding: 36px;">
            <div style="text-align: center; margin-bottom: 28px;">
                <div style="font-size: 4rem; width: 90px; height: 90px; background: var(--primary-soft); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px auto;">👨‍🌾</div>
                <h2 id="profileName" style="font-size: 1.6rem;" data-i18n="profileTitle">Farmer Profile</h2>
                <p style="color: var(--text-muted); font-size: 0.95rem;" data-i18n="profileSubtitle">Manage your personal information and agricultural details.</p>
            </div>

            <form id="profileForm" onsubmit="handleSaveProfile(event)">
                <div class="form-group">
                    <label class="form-label" data-i18n="labelFullName">Full Name</label>
                    <input type="text" id="pName" class="form-control" required>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="labelMobileEmail">Mobile / Identifier</label>
                    <input type="text" id="pIdentifier" class="form-control" readonly style="background: #f0f0f0;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label" data-i18n="labelState">State</label>
                        <input type="text" id="pState" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-i18n="labelDistrict">District</label>
                        <input type="text" id="pDistrict" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="labelPrimaryCrop">Primary Crop</label>
                    <select id="pCrop" class="form-control">
                        <option value="Rice">Rice</option>
                        <option value="Wheat">Wheat</option>
                        <option value="Cotton">Cotton</option>
                        <option value="Groundnut">Groundnut</option>
                        <option value="Vegetables">Vegetables</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 10px;" data-i18n="btnEditProfile">
                    Edit Profile / Save
                </button>
            </form>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let user = authService.getUser();
            if (!user) {
                user = authService.login("demo.farmer@kisora.org", "demo123", true);
            }

            document.getElementById('pName').value = user.name || '';
            document.getElementById('pIdentifier').value = user.identifier || '';
            document.getElementById('pState').value = user.state || '';
            document.getElementById('pDistrict').value = user.district || '';
            document.getElementById('pCrop').value = user.primaryCrop || 'Rice';

            const navAuthArea = document.getElementById('navAuthArea');
            if (navAuthArea) {
                navAuthArea.innerHTML = `
                    <div class="user-dropdown">
                        <button class="user-avatar-btn" onclick="toggleUserDropdown()">
                            <span>👨‍🌾</span>
                            <span>${user.name}</span>
                            <small>▼</small>
                        </button>
                        <div class="dropdown-menu" id="userDropdownMenu">
                            <a href="dashboard.html" class="dropdown-item">📊 <span data-i18n="navDashboard">Dashboard</span></a>
                            <a href="profile.html" class="dropdown-item">👤 <span data-i18n="navProfile">Profile</span></a>
                            <a href="history.html" class="dropdown-item">📜 <span data-i18n="navHistory">My Questions</span></a>
                            <a href="saved.html" class="dropdown-item">❤️ <span data-i18n="navSaved">Saved Advice</span></a>
                            <a href="settings.html" class="dropdown-item">⚙️ <span data-i18n="navSettings">Settings</span></a>
                            <a href="#" onclick="authService.logout()" class="dropdown-item" style="color: #e63946;">🚪 <span data-i18n="navLogout">Logout</span></a>
                        </div>
                    </div>
                `;
            }
        });

        function handleSaveProfile(e) {
            e.preventDefault();
            authService.updateProfile({
                name: document.getElementById('pName').value,
                state: document.getElementById('pState').value,
                district: document.getElementById('pDistrict').value,
                primaryCrop: document.getElementById('pCrop').value
            });
            showToast("Profile updated ✓");
        }

        function toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdownMenu');
            if (dropdown) dropdown.classList.toggle('show');
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('open');
        }

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span>✓</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
