<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - 🌱 KISORA</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: var(--bg-cream); min-height: 100vh; display: flex; flex-direction: column;">

    <header style="padding: 20px 0; border-bottom: 1px solid var(--border-light); background: #ffffff;">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" class="brand-logo">
                <span class="brand-icon">🌱</span>
                <span data-i18n="brandName">KISORA</span>
            </a>
            <div class="website-lang-picker">
                <span>🌐</span>
                <select id="websiteLangSelect" onchange="i18n.setLang(this.value)">
                    <option value="en">English</option>
                    <option value="hi">हिन्दी</option>
                    <option value="gu">ગુજરાતી</option>
                </select>
            </div>
        </div>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
        <div class="card" style="max-width: 520px; width: 100%; padding: 40px;">
            <div style="text-align: center; margin-bottom: 28px;">
                <span style="font-size: 2.5rem;">🌾</span>
                <h2 style="font-size: 1.8rem; margin-top: 8px;" data-i18n="signupTitle">Create Your KISORA Account</h2>
                <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 4px;" data-i18n="signupSubtitle">Join thousands of farmers using smart AI assistance.</p>
            </div>

            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label class="form-label" data-i18n="labelFullName">Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="e.g. Ramesh Patel" required>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="labelMobileEmail">Mobile Number or Email</label>
                    <input type="text" id="identifier" class="form-control" placeholder="e.g. 9876543210" required>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="labelPrefLang">Preferred Interface Language</label>
                    <select id="prefLang" class="form-control" onchange="i18n.setLang(this.value)">
                        <option value="en">English</option>
                        <option value="hi">हिन्दी</option>
                        <option value="gu">ગુજરાતી</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label" data-i18n="labelState">State</label>
                        <input type="text" id="state" class="form-control" placeholder="e.g. Gujarat">
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-i18n="labelDistrict">District</label>
                        <input type="text" id="district" class="form-control" placeholder="e.g. Anand">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="labelPrimaryCrop">Primary Crop</label>
                    <select id="primaryCrop" class="form-control">
                        <option value="rice">Rice (धान / ડાંગર)</option>
                        <option value="wheat">Wheat (गेहूं / ઘઉં)</option>
                        <option value="cotton">Cotton (कपास / કપાસ)</option>
                        <option value="groundnut">Groundnut (मूंगफली / મગફળી)</option>
                        <option value="vegetables">Vegetables (सब्जियां / શાકભાજી)</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="labelPassword">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" onkeyup="checkPasswordStrength(this.value)" required>
                    <div id="strengthBar" style="height: 4px; background: var(--border-light); border-radius: 2px; margin-top: 6px; transition: all 0.3s;"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="labelConfirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 10px;" data-i18n="btnSignupSubmit">Create Account →</button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
                <a href="login.html" style="font-weight: 600;" data-i18n="alreadyAccount">Already have an account? Login</a>
            </div>
        </div>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function checkPasswordStrength(val) {
            const bar = document.getElementById('strengthBar');
            if (val.length === 0) bar.style.width = '0%';
            else if (val.length < 6) { bar.style.width = '33%'; bar.style.background = '#e63946'; }
            else if (val.length < 10) { bar.style.width = '66%'; bar.style.background = '#f4a261'; }
            else { bar.style.width = '100%'; bar.style.background = '#2d6a4f'; }
        }

        function handleSignup(e) {
            e.preventDefault();
            const data = {
                fullName: document.getElementById('fullName').value,
                identifier: document.getElementById('identifier').value,
                websiteLanguage: document.getElementById('prefLang').value,
                state: document.getElementById('state').value,
                district: document.getElementById('district').value,
                primaryCrop: document.getElementById('primaryCrop').value,
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value
            };

            try {
                authService.signup(data);
                window.location.href = 'onboarding.html';
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>
</html>
